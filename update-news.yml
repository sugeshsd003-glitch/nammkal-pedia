name: Update News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install node-fetch rss-parser fs

      - name: Fetch News
        run: node scripts/fetchNews.js

      - name: Generate RSS
        run: node scripts/generateRSS.js

      - name: Generate Sitemap
        run: node scripts/generateSitemap.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git add .
          git commit -m "Auto update news"
          git push